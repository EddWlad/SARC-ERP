spring:
  application:
    name: sarc-bakend
  profiles:
    # Sin perfil explicito (IDE, mvn spring-boot:run) se usa dev. Produccion arranca con
    # SPRING_PROFILES_ACTIVE=prod.
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # Inserciones por lotes: las importaciones escriben miles de filas por transaccion.
          batch_size: 100
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
  datasource:
    hikari:
      data-source-properties:
        # Sin el "Detail: Key (...)=(...)" de PostgreSQL en los mensajes de error: trae valores de
        # columnas (UID/PUK, correos) que terminarian en los logs (QA-10).
        logServerErrorDetail: false
  flyway:
    locations: classpath:db/migration
  servlet:
    # Tope de la peticion: originales de importacion (20 MiB). Cada caso de uso valida su propio limite
    # (imagenes 10 MiB).
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  session:
    timeout: 60m
    jdbc:
      initialize-schema: never
  jackson:
    default-property-inclusion: non_null

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    version: openapi_3_1
  swagger-ui:
    enabled: true

sarc:
  storage:
    # Imagenes y originales de importacion, privados en Cloudinary (TRD 02.1). Vacio = subida deshabilitada (503).
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      root-folder: sarc
  # Zona de operacion: dia de cada sesion, filtros por periodo y fechas de los reportes (TRD 03.3).
  time-zone: America/Guayaquil
  security:
    bcrypt-strength: 12
    max-failed-login-attempts: 5
    lockout-duration: 15m
    # Fallos de ingreso por direccion de origen (TRD 16.1); detras de Nginx la direccion real llega
    # por X-Forwarded-For (server.forward-headers-strategy en prod).
    max-failed-logins-per-client: 20
    client-throttle-window: 15m
  # Admin inicial: solo se crea si no existe ningun usuario. Definir ambas variables.
  bootstrap-admin:
    email: ${SARC_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${SARC_BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${SARC_BOOTSTRAP_ADMIN_NAME:Administrador}
