spring:
  application:
    name: sarc-bakend
  profiles:
    # Sin perfil explicito (IDE, mvn spring-boot:run) se usa dev. Produccion arranca con
    # SPRING_PROFILES_ACTIVE=prod.
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  session:
    timeout: 60m
    jdbc:
      initialize-schema: never
  jackson:
    default-property-inclusion: non_null

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    version: openapi_3_1
  swagger-ui:
    enabled: true

sarc:
  storage:
    # Imagenes privadas en Cloudinary (TRD 02.1). Vacio = subida deshabilitada (503).
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      root-folder: sarc
  reports:
    time-zone: America/Guayaquil
  security:
    bcrypt-strength: 12
    max-failed-login-attempts: 5
    lockout-duration: 15m
  # Admin inicial: solo se crea si no existe ningun usuario. Definir ambas variables.
  bootstrap-admin:
    email: ${SARC_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${SARC_BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${SARC_BOOTSTRAP_ADMIN_NAME:Administrador}
