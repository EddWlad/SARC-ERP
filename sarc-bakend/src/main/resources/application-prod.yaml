spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: ${SARC_DB_URL}
    username: ${SARC_DB_USER}
    password: ${SARC_DB_PASSWORD}

# Produccion no arranca sin credenciales de Cloudinary (FR-025): el error nombra las propiedades, nunca valores.
sarc:
  storage:
    cloudinary:
      required: true
      # Carpeta propia del entorno de produccion (sarc-prod); SARC_STORAGE_CLOUDINARY_ROOT_FOLDER la redefine.
      root-folder: ${SARC_STORAGE_CLOUDINARY_ROOT_FOLDER:sarc-prod}

server:
  forward-headers-strategy: native

# Salud publica minima (FR-035): Nginx solo expone /actuator/health/readiness y devuelve UP o DOWN sin
# detalles. El grupo readiness incluye la base de datos para que "UP" signifique "puede atender peticiones".
management:
  endpoint:
    health:
      show-details: never
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
