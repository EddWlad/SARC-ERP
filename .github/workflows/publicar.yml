name: Publicar

# Publica una versión candidata en producción. NUNCA se ejecuta sola: se dispara a mano (workflow_dispatch) y el
# trabajo `desplegar` exige la aprobación del entorno `production` (revisores: responsable y suplente; sin
# bypass de administradores; solo main y tags de versión). Cada aprobación vale para una sola ejecución.
# Contrato: specs/007-despliegue-seguro-cicd/contracts/deploy-interface.md.
#
# Modos (los tres pasan por la misma aprobación):
#   normal                 publicación habitual (pasos 0 a 11 de sarc-deploy)
#   primera-instalacion    base vacía: sin copia previa ni recibo de copia local; queda «pendiente de verificación»
#   verificar              cierra una primera instalación pendiente (COMPLETADA o FALLIDA)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión candidata a publicar (AAAA.MM.DD-<n>-<sha7>)'
        required: true
        type: string
      modo:
        description: 'Modo de publicación'
        required: true
        type: choice
        default: normal
        options:
          - normal
          - primera-instalacion
          - verificar

permissions:
  contents: read

jobs:
  # Sin entorno ni secretos: valida que la versión existe, que su CI fue exitoso y que las sumas coinciden.
  preparar:
    name: Preparar y validar la versión
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    outputs:
      version: ${{ steps.validar.outputs.version }}
    steps:
      - name: Validar la versión
        id: validar
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+-[0-9a-f]{7}$ ]]; then
            echo "La versión no tiene el formato AAAA.MM.DD-<n>-<sha7>." >&2
            exit 1
          fi
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          mkdir -p dl
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,isDraft >dl/release.json
          jq -e '.isDraft == false' dl/release.json >/dev/null || { echo "El Release es un borrador." >&2; exit 1; }
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir dl \
            --pattern manifest.json --pattern SHA256SUMS --pattern "sarc-backend-${VERSION}.jar" --pattern "sarc-frontend-${VERSION}.tar.gz"
          (cd dl && sha256sum -c SHA256SUMS)
          jq -e --arg v "$VERSION" '.version == $v and ([.checks[].conclusion] | length > 0 and all(. == "success"))' dl/manifest.json >/dev/null \
            || { echo "El manifiesto no corresponde a la versión o tiene comprobaciones sin éxito." >&2; exit 1; }
          run_id="$(jq -r '.ciRunId' dl/manifest.json)"
          commit="$(jq -r '.commit' dl/manifest.json)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '[.conclusion, .head_sha] | @tsv' >dl/ci.tsv
          read -r conclusion head <dl/ci.tsv
          if [ "$conclusion" != "success" ] || [ "$head" != "$commit" ]; then
            echo "El CI de esa versión no fue exitoso o no corresponde a su commit." >&2
            exit 1
          fi
          echo "Versión $VERSION válida: Release, sumas y CI correctos." >>"$GITHUB_STEP_SUMMARY"

  # Con aprobación obligatoria. Una sola publicación a la vez en producción; no se cancela una en curso.
  desplegar:
    name: Desplegar (requiere aprobación)
    needs: preparar
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.preparar.outputs.version }}
      MODO: ${{ inputs.modo }}
      HOST: ${{ vars.SARC_PUBLIC_URL }}
    outputs:
      resultado: ${{ steps.publicar.outputs.resultado }}
      migraciones: ${{ steps.publicar.outputs.migraciones }}
    steps:
      - name: Publicar por SSH (comando forzado)
        id: publicar
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -uo pipefail
          if [ -z "$HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "Falta configuración del entorno production (SARC_PUBLIC_URL, DEPLOY_SSH_KEY o DEPLOY_KNOWN_HOSTS)." >&2
            exit 12
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          case "$MODO" in
            normal) orden="deploy $VERSION" ;;
            primera-instalacion) orden="deploy --primera-instalacion $VERSION" ;;
            verificar) orden="deploy --verificar $VERSION" ;;
            *) echo "Modo no válido." >&2; exit 2 ;;
          esac
          # El comando forzado del VPS solo acepta estas tres formas; el resultado se lee de la salida.
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "sarc-deploy@${HOST}" "$orden" 2>&1 | tee "$RUNNER_TEMP/salida.log"
          codigo="${PIPESTATUS[0]}"
          rm -f "$HOME/.ssh/deploy_key"
          resultado="$(sed -n 's/^SARC_DEPLOY_RESULT //p' "$RUNNER_TEMP/salida.log" | tail -n 1)"
          if [ -n "$resultado" ]; then
            echo "resultado=$(jq -r '.result' <<<"$resultado")" >>"$GITHUB_OUTPUT"
            echo "migraciones=$(jq -c '.migrationsApplied' <<<"$resultado")" >>"$GITHUB_OUTPUT"
          fi
          echo "codigo=$codigo" >>"$GITHUB_OUTPUT"
          exit "$codigo"

      - name: Resumen de la publicación
        if: always()
        shell: bash
        env:
          RESULTADO: ${{ steps.publicar.outputs.resultado }}
          CODIGO: ${{ steps.publicar.outputs.codigo }}
        run: |
          aprobadores="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" --jq '[.[].user.login] | join(", ")' 2>/dev/null || true)"
          texto="$RESULTADO"
          if [ "$RESULTADO" = "EN_CURSO" ]; then texto="pendiente de verificación"; fi
          {
            echo "### Publicación de SARC"
            echo
            echo "- Versión: \`$VERSION\`"
            echo "- Modo: \`$MODO\`"
            echo "- Aprobado por: ${aprobadores:-ver el historial de despliegues del entorno production}"
            echo "- Resultado: ${texto:-sin resultado (código ${CODIGO:-desconocido})}"
            echo "- Registro en el VPS: \`/var/lib/sarc/deploy-history.jsonl\`"
          } >>"$GITHUB_STEP_SUMMARY"

  # Cambio crítico (FR-042): una publicación normal COMPLETADA que aplicó migraciones obliga a ensayar la restauración.
  # La primera instalación no cuenta: parte de una base vacía.
  ensayo-pendiente:
    name: Abrir ensayo de restauración pendiente
    needs: desplegar
    if: needs.desplegar.outputs.resultado == 'COMPLETADA' && inputs.modo == 'normal' && needs.desplegar.outputs.migraciones != '[]' && needs.desplegar.outputs.migraciones != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          VERSION: ${{ inputs.version }}
          RESPONSABLE: ${{ vars.SARC_RESPONSABLE }}
          SUPLENTE: ${{ vars.SARC_SUPLENTE }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const etiquetas = [['ensayo-restauracion', '0e8a16'], ['pendiente', 'fbca04']];
            for (const [name, color] of etiquetas) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                await github.rest.issues.createLabel({ owner, repo, name, color });
              }
            }
            const personas = [process.env.RESPONSABLE, process.env.SUPLENTE]
              .map(p => (p || '').trim().replace(/^@/, '')).filter(Boolean);
            const menciones = personas.length ? personas.map(p => '@' + p).join(' ') : '(responsable y suplente sin configurar)';
            await github.rest.issues.create({
              owner, repo,
              title: `Ensayo de restauración pendiente: cambio crítico en ${process.env.VERSION}`,
              body: `La publicación ${process.env.VERSION} aplicó migraciones de base de datos (cambio crítico). Hay que ensayar la restauración de una copia (ver docs/operacion/restaurar.md) y cerrar este issue con la etiqueta \`aprobado\` solo si pasa el 100 % de las comprobaciones.\n\n${menciones}`,
              labels: ['ensayo-restauracion', 'pendiente'],
              assignees: personas,
            });

  # Aviso de fallo o cancelación. No declara entorno para no pedir otra aprobación; por eso el latido
  # HC_URL_PUBLICACION es un secreto de repositorio (los secretos de entorno no están disponibles aquí).
  avisar:
    name: Avisar fallo de publicación
    needs: [preparar, desplegar]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      HC_URL_PUBLICACION: ${{ secrets.HC_URL_PUBLICACION }}
    steps:
      - uses: actions/github-script@v7
        env:
          RESPONSABLE: ${{ vars.SARC_RESPONSABLE }}
          SUPLENTE: ${{ vars.SARC_SUPLENTE }}
          VERSION: ${{ inputs.version }}
          MODO: ${{ inputs.modo }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const etiqueta = 'alerta-operativa';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: etiqueta });
            } catch (e) {
              await github.rest.issues.createLabel({ owner, repo, name: etiqueta, color: 'b60205',
                description: 'Alerta operativa de SARC' });
            }
            const personas = [process.env.RESPONSABLE, process.env.SUPLENTE]
              .map(p => (p || '').trim().replace(/^@/, '')).filter(Boolean);
            const menciones = personas.length ? personas.map(p => '@' + p).join(' ') : '(responsable y suplente sin configurar)';
            const enlace = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const titulo = 'Publicación fallida o cancelada';
            // Solo versión, modo y enlace: sin salida de comandos ni valores de configuración.
            const cuerpo = `La publicación \`${process.env.VERSION}\` (modo \`${process.env.MODO}\`) falló o se canceló. Ejecución: ${enlace}\n\nProducción puede haber quedado en mantenimiento: seguir docs/operacion/recuperar.md.\n\n${menciones}`;
            const abiertos = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: etiqueta, per_page: 100,
            });
            const existente = abiertos.find(i => i.title === titulo && !i.pull_request);
            if (existente) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existente.number, body: cuerpo });
            } else {
              await github.rest.issues.create({ owner, repo, title: titulo, body: cuerpo,
                labels: [etiqueta], assignees: personas });
            }

      - name: Enviar /fail al latido de publicación
        shell: bash
        run: |
          if [ -n "$HC_URL_PUBLICACION" ]; then
            curl -fsS -m 10 --retry 3 -o /dev/null "${HC_URL_PUBLICACION%/}/fail" || true
          fi
