name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Clasificación de fallos (FR-004): cada trabajo cierra con un resumen que indica si el fallo es de
# infraestructura o del cambio (regla en .github/scripts/classify-failure.sh). Es un fallo de
# infraestructura si falla un paso de preparación (id `prep-*`: checkout, setup-java, setup-node,
# descarga de herramientas) o si el registro contiene un error de red o de tiempo de espera
# (`Could not resolve host`, `Connection timed out`, `ETIMEDOUT`, `503 Service Unavailable`).
# La clasificación solo informa: ambos bloquean la versión. Se reintenta con «Re-run failed jobs».

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sarc-bakend
    steps:
      - id: prep-checkout
        uses: actions/checkout@v4
      - id: prep-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Incluye pruebas unitarias, ArchUnit, integracion con Testcontainers (PostgreSQL 18),
      # la prueba de actualizacion desde la version anterior y la verificacion del contrato
      # docs/api/openapi.json.
      - id: verify
        shell: bash
        run: ./mvnw -B verify 2>&1 | tee "$RUNNER_TEMP/backend.log"
      - name: Clasificar fallo
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: bash .github/scripts/classify-failure.sh "Backend" "$RUNNER_TEMP/backend.log"

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sarc-frontend
    steps:
      - id: prep-checkout
        uses: actions/checkout@v4
      - id: prep-node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sarc-frontend/package-lock.json
      - id: prep-install
        shell: bash
        run: npm ci 2>&1 | tee "$RUNNER_TEMP/frontend-install.log"
      - id: tipos
        name: Tipos generados al dia con el contrato OpenAPI
        shell: bash
        run: |
          npm run api:types
          git diff --exit-code -- src/app/core/api/generated
      - id: lint
        run: npm run lint
      - id: formato
        run: npm run format:check
      - id: pruebas
        run: npm test -- --watch=false
      - id: build
        run: npm run build
      - name: Clasificar fallo
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: bash .github/scripts/classify-failure.sh "Frontend" "$RUNNER_TEMP/frontend-install.log"

  # Las migraciones ya aplicadas no se editan ni se borran; las nuevas llevan un numero mayor
  # (Constitucion III, FR-018).
  migraciones-inmutables:
    name: Migraciones inmutables
    runs-on: ubuntu-latest
    steps:
      - id: prep-checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: comprobar
        run: bash .github/scripts/check-migrations-immutable.sh
      - name: Clasificar fallo
        if: always()
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: bash .github/scripts/classify-failure.sh "Migraciones inmutables"

  # Dependencias (FR-005): revision de dependencias nuevas en el PR y OSV-Scanner sobre los
  # archivos de bloqueo. CVSS >= 7.0 bloquea; severidad media solo avisa en el resumen.
  # Excepciones aceptadas: osv-scanner.toml, con motivo y fecha de revision.
  dependencias:
    name: Dependencias
    runs-on: ubuntu-latest
    steps:
      - id: prep-checkout
        uses: actions/checkout@v4
      - id: revision
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      # OSV-Scanner oficial fijado por version y suma SHA-256 (la action publicada no admite un
      # umbral de severidad; el umbral lo aplica .github/scripts/osv-gate.sh).
      - id: prep-osv
        name: Descargar OSV-Scanner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - id: osv
        name: Escanear dependencias
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/osv-scanner" scan --format json --config=osv-scanner.toml \
            -L sarc-bakend/pom.xml -L sarc-frontend/package-lock.json >"$RUNNER_TEMP/osv-results.json"
          codigo=$?
          set -e
          # 0 = sin vulnerabilidades, 1 = hay vulnerabilidades (decide osv-gate.sh); otro = error de la herramienta.
          if [ "$codigo" -ne 0 ] && [ "$codigo" -ne 1 ]; then
            echo "OSV-Scanner terminó con el código $codigo" >&2
            exit "$codigo"
          fi
          bash .github/scripts/osv-gate.sh "$RUNNER_TEMP/osv-results.json"
      - name: Clasificar fallo
        if: always()
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: bash .github/scripts/classify-failure.sh "Dependencias"

  # Secretos (FR-005, SC-005): gitleaks sobre los commits nuevos y sobre el arbol. `--redact`
  # impide imprimir el valor encontrado.
  secretos:
    name: Secretos
    runs-on: ubuntu-latest
    steps:
      - id: prep-checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prep-gitleaks
        name: Descargar gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - id: commits
        name: Escanear commits nuevos
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          HEAD_PR: ${{ github.event.pull_request.head.sha }}
          ANTES: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then
            rango="$BASE_PR..$HEAD_PR"
          elif [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ]; then
            rango="$ANTES..$SHA"
          else
            rango="$SHA"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml --log-opts="$rango" .
      - id: arbol
        name: Escanear el arbol de trabajo
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" dir --redact --no-banner --config .gitleaks.toml .'
      - name: Clasificar fallo
        if: always()
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: bash .github/scripts/classify-failure.sh "Secretos"

  # Scripts de despliegue (FR-021, FR-022, FR-031): shellcheck y pruebas bats con dobles; nunca
  # tocan la base local, el VPS ni Cloudinary.
  scripts-despliegue:
    name: Scripts de despliegue
    runs-on: ubuntu-latest
    steps:
      - id: prep-checkout
        uses: actions/checkout@v4
      - id: prep-herramientas
        name: Instalar herramientas de pruebas de despliegue
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y age bats jq
      - id: shellcheck
        shell: bash
        run: |
          shopt -s nullglob
          shellcheck deploy/scripts/*.sh deploy/scripts/lib/*.sh deploy/release/*.sh .github/scripts/*.sh
      # Git en Windows no conserva el bit de ejecución: se asegura antes de las pruebas, que invocan los scripts.
      - id: permisos
        shell: bash
        run: chmod +x deploy/scripts/*.sh deploy/release/*.sh .github/scripts/*.sh
      - id: bats
        shell: bash
        run: bats deploy/tests/
      # La regla sudoers de la cuenta de despliegue se valida con visudo en un contenedor desechable.
      - id: sudoers
        name: Validar la regla sudoers
        shell: bash
        run: |
          docker run --rm -v "$PWD/deploy/sudoers:/s:ro" ubuntu:24.04 bash -c             'apt-get update -qq && apt-get install -y -qq sudo >/dev/null && visudo -c -f /s/sarc-deploy'
      - name: Clasificar fallo
        if: always()
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: bash .github/scripts/classify-failure.sh "Scripts de despliegue"

  # Aviso de fallo (FR-038): en `main` abre o comenta un issue `alerta-operativa`; en un PR del
  # propio repositorio comenta en el PR. Ambos mencionan a responsable y suplente (variables de
  # repositorio SARC_RESPONSABLE y SARC_SUPLENTE). Solo nombra el trabajo, el commit corto y el
  # enlace de la ejecucion: sin secretos ni datos personales.
  avisar-fallo:
    name: Avisar fallo
    if: failure()
    needs:
      - backend
      - frontend
      - migraciones-inmutables
      - dependencias
      - secretos
      - scripts-despliegue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESPONSABLE: ${{ vars.SARC_RESPONSABLE }}
          SUPLENTE: ${{ vars.SARC_SUPLENTE }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const evento = context.eventName;
            const esFork = evento === 'pull_request'
              && context.payload.pull_request.head.repo.full_name !== `${owner}/${repo}`;
            if (esFork) {
              core.info('PR desde un fork: el token no tiene escritura; basta la comprobacion visible.');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: context.runId, per_page: 100,
            });
            const fallidos = jobs
              .filter(j => j.conclusion === 'failure' && j.name !== 'Avisar fallo')
              .map(j => j.name);
            const lista = fallidos.length ? fallidos.join(', ') : 'sin determinar';
            const corto = context.sha.slice(0, 7);
            const enlace = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const personas = [process.env.RESPONSABLE, process.env.SUPLENTE]
              .map(p => (p || '').trim().replace(/^@/, ''))
              .filter(Boolean);
            const menciones = personas.length ? personas.map(p => '@' + p).join(' ') : '(responsable y suplente sin configurar)';
            const cuerpo = `CI fallido. Trabajos: ${lista}. Commit: ${corto}. Ejecucion: ${enlace}\n\n${menciones}`;

            if (evento === 'push') {
              const etiqueta = 'alerta-operativa';
              try {
                await github.rest.issues.getLabel({ owner, repo, name: etiqueta });
              } catch (e) {
                await github.rest.issues.createLabel({ owner, repo, name: etiqueta, color: 'b60205',
                  description: 'Alerta operativa de SARC' });
              }
              const titulo = 'CI fallido en main';
              const abiertos = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'open', labels: etiqueta, per_page: 100,
              });
              const existente = abiertos.find(i => i.title === titulo && !i.pull_request);
              if (existente) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existente.number, body: cuerpo });
              } else {
                await github.rest.issues.create({ owner, repo, title: titulo, body: cuerpo,
                  labels: [etiqueta], assignees: personas });
              }
              return;
            }

            if (evento === 'pull_request') {
              const marca = '<!-- sarc-ci-fallo -->';
              const numero = context.payload.pull_request.number;
              const comentarios = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: numero, per_page: 100,
              });
              const previo = comentarios.find(c => c.body && c.body.startsWith(marca));
              const texto = `${marca}\n${cuerpo}`;
              if (previo) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: previo.id, body: texto });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: numero, body: texto });
              }
            }
