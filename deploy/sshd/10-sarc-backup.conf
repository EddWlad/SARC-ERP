# Cuenta `sarc-backup`: solo SFTP enjaulado en el directorio de copias (FR-039, FR-039a).
# Se instala en /etc/ssh/sshd_config.d/10-sarc-backup.conf (root:root 0644) y se activa con `sshd -t && systemctl reload ssh`.
# Sin valores reales: la clave publica vive en /etc/ssh/sarc-backup.authorized_keys (root:root 0644), no en el repositorio.
Match User sarc-backup
    AuthorizedKeysFile /etc/ssh/sarc-backup.authorized_keys
    ChrootDirectory /var/backups/sarc
    ForceCommand internal-sftp
    AllowTcpForwarding no
    X11Forwarding no
    PermitTTY no
